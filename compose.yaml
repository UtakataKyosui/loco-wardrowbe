services:
  db:
    image: postgres:15.3-alpine
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: wardrowbe_development
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco -d wardrowbe_development"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    profiles: [extras]
    ports:
      - 6379:6379

volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco -d wardrowbe_development"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    profiles: [extras]
    ports:
      - 6379:6379

  mailer:
    image: mailtutan/mailtutan:latest
    restart: unless-stopped
    mem_limit: 64m
    profiles: [extras]
    ports:
      - 1080:1080
      - 1025:1025

volumes:
  postgres-data:

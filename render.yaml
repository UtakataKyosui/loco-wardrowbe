databases:
  - name: wardrowbe-db
    plan: free
    databaseName: wardrowbe
    user: wardrowbe

services:
  - type: web
    name: wardrowbe
    runtime: rust
    plan: free
    buildCommand: |
      corepack enable
      pnpm --dir frontend install --frozen-lockfile
      pnpm --dir frontend build
      cargo build --release
    startCommand: ./target/release/wardrowbe-cli start
    healthCheckPath: /
    envVars:
      - key: LOCO_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wardrowbe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HOST
        sync: false
      - key: MAILER_HOST
        sync: false
      - key: MAILER_USER
        sync: false
      - key: MAILER_PASSWORD
        sync: false

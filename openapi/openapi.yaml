openapi: 3.1.0
info:
  title: wardrowbe API
  description: HTTP API of wardrowbe, built on [Loco](https://loco.rs).
  license:
    name: ''
  version: 0.1.0
paths:
  /api/auth/current:
    get:
      tags:
      - auth
      summary: Returns the signed-in user
      description: Reads the user identified by the JWT in the `Authorization` header.
      operationId: current
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
        '401':
          description: Missing or invalid token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge (RFC 6750 §3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - jwt_token: []
  /api/auth/forgot:
    post:
      tags:
      - auth
      summary: |-
        In case the user forgot his password  this endpoints generate a forgot token
        and send email to the user. In case the email not found in our DB, we are
        returning a valid request for security reasons (not exposing users DB
        list).
      operationId: forgot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotParams'
        required: true
      responses:
        '200':
          description: Request accepted. Always 200, even when the email is unknown
        '400':
          description: Request body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Creates a user login and returns a token
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginParams'
        required: true
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid credentials
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge (RFC 6750 §3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/magic-link:
    post:
      tags:
      - auth
      summary: Magic link authentication provides a secure and passwordless way to log in to the application.
      description: |-
        # Flow
        1. **Request a Magic Link**:
           A registered user sends a POST request to `/magic-link` with their email.
           If the email exists, a short-lived, one-time-use token is generated and sent to the user's email.
           For security and to avoid exposing whether an email exists, the response always returns 200, even if the email is invalid.

        2. **Click the Magic Link**:
           The user clicks the link (`/magic-link#<token>`, a page of the SPA), which posts the token to
           `/magic-link/verify`; that validates the token and its expiration.
           If valid, the server generates a JWT and responds with a [`LoginResponse`].
           If invalid or expired, an unauthorized response is returned.

        This flow enhances security by avoiding traditional passwords and providing a seamless login experience.
      operationId: magic_link
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkParams'
        required: true
      responses:
        '200':
          description: Request accepted. Always 200, even when the email is unknown
        '400':
          description: Email is not on an allowed domain, or the body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/magic-link/verify:
    post:
      tags:
      - auth
      summary: Verifies a magic link token and authenticates the user.
      description: |-
        A `POST` for the same reason as [`verify`]: it consumes the one-time token
        and issues a JWT. The mail links to the SPA page `/magic-link#<token>`.
      operationId: magic_link_verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenParams'
        required: true
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid or expired token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge (RFC 6750 §3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/register:
    post:
      tags:
      - auth
      summary: |-
        Register function creates a new user with the given parameters and sends a
        welcome email to the user
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterParams'
        required: true
      responses:
        '200':
          description: Request accepted. Always 200, even when the email is already taken, so registered emails are not exposed
        '400':
          description: Request body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/resend-verification-mail:
    post:
      tags:
      - auth
      summary: Re-sends the verification email
      description: Always answers 200 so registered emails are not exposed.
      operationId: resend_verification_email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationParams'
        required: true
      responses:
        '200':
          description: Request accepted
        '400':
          description: Request body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/reset:
    post:
      tags:
      - auth
      summary: reset user password by the given parameters
      operationId: reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetParams'
        required: true
      responses:
        '200':
          description: Request accepted. Always 200, even when the token is unknown
        '400':
          description: Request body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/verify:
    post:
      tags:
      - auth
      summary: |-
        Verify register user. if the user not verified his email, he can't login to
        the system.
      description: |-
        A `POST`, not a `GET`: it changes the user, and a safe method must not
        (RFC 9110 §9.2.1). Mail scanners and link previewers fetch `GET` URLs on
        their own, which would verify (or burn the token of) an address nobody
        clicked. The mail links to the SPA page `/verify#<token>`, which posts the
        token here.
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenParams'
        required: true
      responses:
        '204':
          description: Email verified (or already verified)
        '400':
          description: Request body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge (RFC 6750 §3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    CurrentResponse:
      type: object
      required:
      - pid
      - name
      - email
      properties:
        email:
          type: string
        name:
          type: string
        pid:
          type: string
          format: uuid
          description: Public identifier of the user (RFC 9562 UUID).
    FieldError:
      type: object
      description: |-
        One invalid field of a validation failure (extension member of
        [`ProblemDetails`]).
      required:
      - pointer
      - detail
      properties:
        detail:
          type: string
          description: What is wrong with the field.
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid field of the request body.
          example: /email
    ForgotParams:
      type: object
      required:
      - email
      properties:
        email:
          type: string
    LoginParams:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
      - token
      - pid
      - name
      - is_verified
      properties:
        is_verified:
          type: boolean
        name:
          type: string
        pid:
          type: string
          format: uuid
          description: Public identifier of the user (RFC 9562 UUID).
        token:
          type: string
    MagicLinkParams:
      type: object
      required:
      - email
      properties:
        email:
          type: string
    ProblemDetails:
      type: object
      description: |-
        An RFC 9457 "problem details" object, the body of every error response of
        the `/api/` routes (`Content-Type: application/problem+json`).

        It is produced for every error by `initializers::problem_details`, so the
        `OpenAPI` description matches what the server really sends. Use it as the
        `body` (with `content_type = "application/problem+json"`) of every error
        response in `#[utoipa::path]`.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Explanation specific to this occurrence of the problem.
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldError'
          description: |-
            Extension member, present on validation failures: one entry per
            invalid field.
        instance:
          type:
          - string
          - 'null'
          description: |-
            A URI reference that identifies this occurrence (`urn:uuid:` of the
            `x-request-id` response header), to find it in the server logs.
        status:
          type: integer
          format: int32
          description: The HTTP status code of the response, repeated for convenience.
          minimum: 0
        title:
          type: string
          description: |-
            Short, human-readable summary of the problem type (the HTTP status
            phrase while `type` is `about:blank`).
        type:
          type: string
          description: |-
            A URI reference that identifies the problem type. `about:blank` means
            the problem has no semantics beyond the HTTP status code.
          example: about:blank
    RegisterParams:
      type: object
      required:
      - email
      - password
      - name
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
    ResendVerificationParams:
      type: object
      required:
      - email
      properties:
        email:
          type: string
    ResetParams:
      type: object
      required:
      - token
      - password
      properties:
        password:
          type: string
        token:
          type: string
    TokenParams:
      type: object
      description: |-
        The one-time token from an e-mail link (e-mail verification, magic link).

        It travels in the request body, not in the URL, so it stays out of access
        logs, browser history and `Referer` (RFC 3986 §7.5).
      required:
      - token
      properties:
        token:
          type: string
  securitySchemes:
    jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Registration, login and account recovery

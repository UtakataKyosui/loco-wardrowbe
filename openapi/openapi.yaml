openapi: 3.1.0
info:
  title: wardrowbe API
  description: HTTP API of wardrowbe, built on [Loco](https://loco.rs).
  license:
    name: ''
  version: 0.1.0
paths:
  /api/auth/current:
    get:
      tags:
      - auth
      summary: Returns the signed-in user
      description: |-
        The caller signs in with Clerk and sends the session token in the
        `Authorization` header. The first request of a new Clerk user creates their
        row here.
      operationId: current
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
        '401':
          description: Missing or invalid token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge (RFC 6750 §3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Clerk sign-in is not configured, or Clerk's keys cannot be fetched
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - jwt_token: []
components:
  schemas:
    CurrentResponse:
      type: object
      required:
      - pid
      - name
      properties:
        email:
          type:
          - string
          - 'null'
          description: '`null` until Clerk''s session token carries an `email` claim.'
        name:
          type: string
          description: Display name; falls back to the e-mail address when Clerk sent no name.
        pid:
          type: string
          format: uuid
          description: Public identifier of the user (RFC 9562 UUID).
    FieldError:
      type: object
      description: |-
        One invalid field of a validation failure (extension member of
        [`ProblemDetails`]).
      required:
      - pointer
      - detail
      properties:
        detail:
          type: string
          description: What is wrong with the field.
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid field of the request body.
          example: /email
    ProblemDetails:
      type: object
      description: |-
        An RFC 9457 "problem details" object, the body of every error response of
        the `/api/` routes (`Content-Type: application/problem+json`).

        It is produced for every error by `initializers::problem_details`, so the
        `OpenAPI` description matches what the server really sends. Use it as the
        `body` (with `content_type = "application/problem+json"`) of every error
        response in `#[utoipa::path]`.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Explanation specific to this occurrence of the problem.
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldError'
          description: |-
            Extension member, present on validation failures: one entry per
            invalid field.
        instance:
          type:
          - string
          - 'null'
          description: |-
            A URI reference that identifies this occurrence (`urn:uuid:` of the
            `x-request-id` response header), to find it in the server logs.
        status:
          type: integer
          format: int32
          description: The HTTP status code of the response, repeated for convenience.
          minimum: 0
        title:
          type: string
          description: |-
            Short, human-readable summary of the problem type (the HTTP status
            phrase while `type` is `about:blank`).
        type:
          type: string
          description: |-
            A URI reference that identifies the problem type. `about:blank` means
            the problem has no semantics beyond the HTTP status code.
          example: about:blank
  securitySchemes:
    jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: The signed-in user. Sign-in itself is handled by Clerk
